services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    env_file:
      - .env.rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: mysql
    env_file:
      - .env.mysql
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  php-producer:
    build:
      context: ./php-producer
    container_name: php-producer
    ports:
      - "8080:80"
    volumes:
      - ./storage:/app/storage
      - ./php-producer/.env:/var/www/html/.env:ro
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "php artisan migrate --force --no-interaction && chown -R www-data:www-data storage bootstrap/cache && apache2-foreground"
    restart: unless-stopped
    networks:
      - app-network

  qwen-vl:
    image: vllm/vllm-openai:latest
    container_name: qwen-vl
    runtime: nvidia
    shm_size: "4g"
    env_file:
      - .env.huggingface
    environment:
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HF_HOME=/cache/huggingface
    volumes:
      - hf_cache:/cache/huggingface
    ports:
      - "8001:8000"
    command:
      - "--enforce-eager"
      - "--model"
      - "JEILDLWLRMA/Qwen3-VL-4B-Instruct-NVFP4"
      - "--quantization"
      - "compressed-tensors"
      - "--kv-cache-dtype"
      - "fp8"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.8"
      - "--max-model-len"
      - "1024"
      - "--dtype"
      - "half"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped

  python-consumer:
    build:
      context: ./python-consumer
    container_name: python-consumer
    volumes:
      - ./python-consumer:/app
      - ./storage:/app/storage
    env_file:
      - ./python-consumer/.env.python
    depends_on:
      - rabbitmq
      - qwen-vl
    networks:
      - app-network
    command: python /app/main.py

networks:
  app-network:
    driver: bridge

volumes:
  rabbitmq_data:
  mysql_data:
  hf_cache:
  redis_data: